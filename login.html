```html
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | CalorieTrack</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .auth-container {
        max-width: 420px;
        margin: 70px auto;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        background: #fff;
        color: #333;
      }

      .auth-container h1 {
        text-align: center;
        margin-bottom: 10px;
      }

      .auth-container p {
        text-align: center;
        margin-bottom: 25px;
      }

      .auth-container label {
        display: block;
        margin: 14px 0 6px;
      }

      .auth-container input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
      }

      .auth-container button {
        width: 100%;
        padding: 12px;
        margin-top: 22px;
        border: none;
        border-radius: 6px;
        background: #28a745;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      .auth-container button:hover {
        background: #218838;
      }

      .auth-message {
        margin-top: 15px;
        font-size: 14px;
        text-align: center;
      }

      .auth-link {
        text-align: center;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <h1>Welcome Back!</h1>
      <p>Login to your CalorieTrack account</p>

      <form id="loginForm">
        <label for="email">Email Address</label>
        <input type="email" id="email" required autocomplete="email" />

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          required
          autocomplete="current-password"
        />

        <button type="submit">Login</button>
        <div id="message" class="auth-message" role="status"></div>
      </form>

      <div class="auth-link">
        Don't have an account?
        <a href="register.html">Register here</a>
      </div>
    </div>

    <script src="js/auth.js"></script>
  </body>
</html>
```
